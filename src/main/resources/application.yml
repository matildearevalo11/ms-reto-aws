spring:
  application:
    name: ms-reto-aws
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA}
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA}
    schemas: ${DB_SCHEMA}
    create-schemas: false
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: ${API_CONTEXT_PATH:/api/v1}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
