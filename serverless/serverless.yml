service: ms-reto-aws-users
frameworkVersion: "4"

provider:
  name: aws
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  environment:
    USERS_TABLE:
      Ref: UsersTable
  logs:
    httpApi: true
  httpApi:
    cors: true

package:
  individually: true
  patterns:
    - "!**"

functions:
  getUsers:
    name: ${self:service}-${sls:stage}-get-users-java
    runtime: java21
    architecture: arm64
    handler: com.retoaws.users.GetUsersHandler
    role:
      Fn::GetAtt: [GetUsersLambdaRole, Arn]
    package:
      artifact: java/target/users-java.jar
    events:
      - httpApi:
          method: GET
          path: /users

  createUser:
    name: ${self:service}-${sls:stage}-create-user-java
    runtime: java21
    architecture: arm64
    memorySize: 512
    timeout: 30
    handler: com.retoaws.users.CreateUserHandler
    role:
      Fn::GetAtt: [CreateUserLambdaRole, Arn]
    environment:
      USERS_TABLE:
        Ref: UsersTable
      USER_CREATED_QUEUE_URL:
        Ref: UserCreatedQueue
    package:
      artifact: java/target/users-java.jar
    events:
      - httpApi:
          method: POST
          path: /users

  sendEmails:
    name: ${self:service}-${sls:stage}-send-emails-node
    handler: node/email-handler.sendEmails
    role:
      Fn::GetAtt: [SendEmailsLambdaRole, Arn]
    environment:
      USER_NOTIFICATIONS_TOPIC_ARN:
        Ref: UserNotificationsTopic
    package:
      patterns:
        - node/**
        - "!node/**/*.test.js"
    events:
      - sqs:
          arn:
            Fn::GetAtt: [UserCreatedQueue, Arn]
          batchSize: 10
          maximumBatchingWindow: 5
          functionResponseType: ReportBatchItemFailures

  updateUser:
    name: ${self:service}-${sls:stage}-update-user-node
    handler: node/handler.updateUser
    role:
      Fn::GetAtt: [UpdateUserLambdaRole, Arn]
    package:
      patterns:
        - node/**
    events:
      - httpApi:
          method: PUT
          path: /users/{id}

  deleteUser:
    name: ${self:service}-${sls:stage}-delete-user-node
    handler: node/handler.deleteUser
    role:
      Fn::GetAtt: [DeleteUserLambdaRole, Arn]
    package:
      patterns:
        - node/**
    events:
      - httpApi:
          method: DELETE
          path: /users/{id}

resources:
  Description: User APIs with private persistence and queued email notifications.
  Conditions:
    HasNotificationEmail:
      Fn::Not:
        - Fn::Equals:
            - ${param:notificationEmail, ''}
            - ""
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        SSESpecification:
          SSEEnabled: true
        ResourcePolicy:
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyDataAccessOutsideUserLambdas
                Effect: Deny
                Principal: "*"
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PartiQLDelete
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLSelect
                  - dynamodb:PartiQLUpdate
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-${sls:stage}
                Condition:
                  ArnNotLike:
                    aws:PrincipalArn:
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-GetUsersLambdaRole-*
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-CreateUserLambdaRole-*
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-UpdateUserLambdaRole-*
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-DeleteUserLambdaRole-*

    GetUsersLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: &lambdaTrustPolicy
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: ReadUsersAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - &lambdaLogs
                  Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action: dynamodb:Scan
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]

    CreateUserLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrustPolicy
        Policies:
          - PolicyName: CreateUsersAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - *lambdaLogs
                - Effect: Allow
                  Action: dynamodb:PutItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]
                - Effect: Allow
                  Action: sqs:SendMessage
                  Resource:
                    Fn::GetAtt: [UserCreatedQueue, Arn]

    UpdateUserLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrustPolicy
        Policies:
          - PolicyName: UpdateUsersAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - *lambdaLogs
                - Effect: Allow
                  Action: dynamodb:UpdateItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]

    DeleteUserLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrustPolicy
        Policies:
          - PolicyName: DeleteUsersAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - *lambdaLogs
                - Effect: Allow
                  Action: dynamodb:DeleteItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]

    SendEmailsLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrustPolicy
        Policies:
          - PolicyName: ConsumeUserEventsPublishNotificationsAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - *lambdaLogs
                - Effect: Allow
                  Action:
                    - sqs:ChangeMessageVisibility
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                    - sqs:ReceiveMessage
                  Resource:
                    Fn::GetAtt: [UserCreatedQueue, Arn]
                - Effect: Allow
                  Action: sns:Publish
                  Resource:
                    Ref: UserNotificationsTopic

    UserCreatedDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-user-created-dlq
        KmsMasterKeyId: alias/aws/sqs
        MessageRetentionPeriod: 1209600

    UserCreatedQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-user-created
        KmsMasterKeyId: alias/aws/sqs
        MessageRetentionPeriod: 345600
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [UserCreatedDeadLetterQueue, Arn]
          maxReceiveCount: 3

    UserCreatedQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - Ref: UserCreatedQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: DenyQueueAccessOutsideMessagingLambdas
              Effect: Deny
              Principal: "*"
              Action:
                - sqs:ChangeMessageVisibility
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:GetQueueUrl
                - sqs:ReceiveMessage
                - sqs:SendMessage
              Resource:
                Fn::GetAtt: [UserCreatedQueue, Arn]
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn:
                    - Fn::GetAtt: [CreateUserLambdaRole, Arn]
                    - Fn::GetAtt: [SendEmailsLambdaRole, Arn]

    UserNotificationsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-user-notifications

    UserNotificationsTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - Ref: UserNotificationsTopic
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: DenyPublishOutsideSendEmailsLambda
              Effect: Deny
              Principal: "*"
              Action: sns:Publish
              Resource:
                Ref: UserNotificationsTopic
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn:
                    Fn::GetAtt: [SendEmailsLambdaRole, Arn]

    UserNotificationsEmailSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasNotificationEmail
      Properties:
        Protocol: email
        Endpoint: ${param:notificationEmail, ''}
        TopicArn:
          Ref: UserNotificationsTopic
  Outputs:
    UsersApiUrl:
      Description: Base URL of the shared HTTP API
      Value:
        Fn::GetAtt:
          - HttpApi
          - ApiEndpoint
    UsersTableName:
      Description: Private DynamoDB table used by the four Lambda functions
      Value:
        Ref: UsersTable
    UserCreatedQueueUrl:
      Description: Queue receiving user-created events
      Value:
        Ref: UserCreatedQueue
    UserCreatedDeadLetterQueueUrl:
      Description: Dead-letter queue for failed user-created events
      Value:
        Ref: UserCreatedDeadLetterQueue
    UserNotificationsTopicArn:
      Description: SNS topic used exclusively by the email Lambda
      Value:
        Ref: UserNotificationsTopic
