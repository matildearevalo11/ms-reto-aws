service: ms-reto-aws-users
frameworkVersion: "4"

provider:
  name: aws
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  architecture: arm64
  memorySize: 256
  timeout: 10
  environment:
    USERS_TABLE:
      Ref: UsersTable
  logs:
    httpApi: true
  httpApi:
    cors: true

package:
  individually: true
  patterns:
    - "!**"

functions:
  getUsers:
    name: ${self:service}-${sls:stage}-get-users-java
    runtime: java21
    architecture: arm64
    handler: com.retoaws.users.GetUsersHandler
    role:
      Fn::GetAtt: [GetUsersLambdaRole, Arn]
    package:
      artifact: java/target/users-java.jar
    events:
      - httpApi:
          method: GET
          path: /users

  createUser:
    name: ${self:service}-${sls:stage}-create-user-java
    runtime: java21
    architecture: arm64
    handler: com.retoaws.users.CreateUserHandler
    role:
      Fn::GetAtt: [CreateUserLambdaRole, Arn]
    package:
      artifact: java/target/users-java.jar
    events:
      - httpApi:
          method: POST
          path: /users

  updateUser:
    name: ${self:service}-${sls:stage}-update-user-node
    handler: node/handler.updateUser
    role:
      Fn::GetAtt: [UpdateUserLambdaRole, Arn]
    package:
      patterns:
        - node/**
    events:
      - httpApi:
          method: PUT
          path: /users/{id}

  deleteUser:
    name: ${self:service}-${sls:stage}-delete-user-node
    handler: node/handler.deleteUser
    role:
      Fn::GetAtt: [DeleteUserLambdaRole, Arn]
    package:
      patterns:
        - node/**
    events:
      - httpApi:
          method: DELETE
          path: /users/{id}

resources:
  Description: Four user endpoints backed by a private DynamoDB table.
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        SSESpecification:
          SSEEnabled: true
        ResourcePolicy:
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyDataAccessOutsideUserLambdas
                Effect: Deny
                Principal: "*"
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PartiQLDelete
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLSelect
                  - dynamodb:PartiQLUpdate
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-${sls:stage}
                Condition:
                  ArnNotLike:
                    aws:PrincipalArn:
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-GetUsersLambdaRole-*
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-CreateUserLambdaRole-*
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-UpdateUserLambdaRole-*
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-DeleteUserLambdaRole-*

    GetUsersLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: &lambdaTrustPolicy
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: ReadUsersAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - &lambdaLogs
                  Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: "*"
                - Effect: Allow
                  Action: dynamodb:Scan
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]

    CreateUserLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrustPolicy
        Policies:
          - PolicyName: CreateUsersAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - *lambdaLogs
                - Effect: Allow
                  Action: dynamodb:PutItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]

    UpdateUserLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrustPolicy
        Policies:
          - PolicyName: UpdateUsersAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - *lambdaLogs
                - Effect: Allow
                  Action: dynamodb:UpdateItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]

    DeleteUserLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument: *lambdaTrustPolicy
        Policies:
          - PolicyName: DeleteUsersAndWriteLogs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - *lambdaLogs
                - Effect: Allow
                  Action: dynamodb:DeleteItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]
  Outputs:
    UsersApiUrl:
      Description: Base URL of the shared HTTP API
      Value:
        Fn::GetAtt:
          - HttpApi
          - ApiEndpoint
    UsersTableName:
      Description: Private DynamoDB table used by the four Lambda functions
      Value:
        Ref: UsersTable
